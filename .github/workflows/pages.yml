name: Publish ReadyClip site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/pages.yml']
  release:
    types: [published]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Link the verified beta asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=ReadyClip-0.5.1-beta-x64.msi
          url=$(gh release view v0.5.1-beta --json assets --jq ".assets[] | select(.name == \"$asset\") | .url")
          next_asset=ReadyClip-0.5.2-beta-x64.msi
          if next_url=$(gh release view v0.5.2-beta --json assets --jq ".assets[] | select(.name == \"$next_asset\") | .url") && [ -n "$next_url" ]; then
            url="$next_url"
            sed -i 's/0\.5\.1/0.5.2/g; s/46F5B7C6E3C14EC5A89E75BC5939EAA3A5760D88DBDEC471AADB4671AC7DC3A6/575701824C653FA17507B426B479CD8E14846FC838DC7F0365791FD97D9AB9A1/' dist/index.html
            asset="$next_asset"
          fi
          test -n "$url"
          sed -i "s|href=\"$asset\"|href=\"$url\"|" dist/index.html
      - name: Prefer the verified portable build when published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          portable=ReadyClip-0.5.3-beta-Windows-x64.zip
          digest=547dbc6f8f2afb30706282058672d7cbf71c4dffacff49810bf6c921b215695c
          if ! release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.5.3-beta" 2>/dev/null); then exit 0; fi
          url=$(jq -r --arg file "$portable" --arg hash "sha256:$digest" '.assets[] | select(.name == $file and .digest == $hash) | .browser_download_url' <<< "$release")
          if [ -n "$url" ]; then
            sed -Ei "s|class=\"cta\" href=\"[^\"]+\"|class=\"cta\" href=\"$url\"|; s|Windows x64 · Beta [^<]+|Windows x64 · Beta 0.5.3 · 420 MB ZIP · Extract and open App/ReadyClip.exe|; s|ReadyClip-0\.5\.[12]-beta-x64\.msi</code>|$portable</code>|; s|<code>[[:xdigit:]]{64}</code>|<code>$digest</code>|" dist/index.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  verify-domain:
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 3
    steps:
      - name: Verify the public ReadyClip HTTPS endpoint
        shell: bash
        run: |
          set -uo pipefail
          host=readyclip.studio
          page=$(mktemp)
          status=0
          if ! curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 15 "https://$host/" --output "$page" --write-out 'HTTPS %{http_code} %{url_effective}\n'; then
            status=1
          elif ! grep -Fq '<title>ReadyClip' "$page"; then
            echo 'HTTPS returned a different page.'
            status=1
          fi
          redirect=$(curl --silent --show-error --max-time 12 --output /dev/null --write-out '%{http_code} %{redirect_url}' "http://$host/") || status=1
          echo "HTTP response: $redirect"
          case "$redirect" in
            "301 https://$host/"|"302 https://$host/"|"307 https://$host/"|"308 https://$host/") ;;
            *) status=1 ;;
          esac
          if [[ $status != 0 ]]; then
            for kind in A AAAA CAA NS; do
              echo "$host $kind"
              dig +time=3 +tries=1 +noall +answer "$host" "$kind"
            done
            echo 'WWW records'
            dig +time=3 +tries=1 +noall +answer "www.$host" A
            echo 'Served certificate'
            timeout 10 openssl s_client -connect "$host:443" -servername "$host" </dev/null 2>/dev/null | openssl x509 -noout -issuer -dates -ext subjectAltName || true
          fi
          exit "$status"
